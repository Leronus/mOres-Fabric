plugins {
	id 'fabric-loom' version '1.8.9'
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	maven {
		url = 'https://maven.minecraftforge.net/'
	}
	maven {
		url = 'https://api.modrinth.com/maven'
	}
	maven {
		url = 'https://maven.kyrptonaught.dev'
	}
	maven {
		url = 'https://jitpack.io'
	}
	maven {
		url = 'https://maven.terraformersmc.com/releases/'
	}
	maven {
		url = "https://api.modrinth.com/maven"
	}
	maven {
		url = "https://cursemaven.com"
	}
	maven {
		name = 'ParchmentMC'
		url = 'https://maven.parchmentmc.org'
	}
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"mores" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

}

fabricApi {
	configureDataGeneration()
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	modImplementation "maven.modrinth:sodium:${project.sodium_version}"
	modImplementation "maven.modrinth:lithium:${project.lithium_version}"
	modImplementation "maven.modrinth:iris:${project.iris_version}"
	modImplementation "maven.modrinth:indium:${project.indium_version}"
	modImplementation "maven.modrinth:nvidium:${project.nvidium_version}"

	//EntityCulling
//	modImplementation "maven.modrinth:entityculling:${project.entity_culling_version}"
	//Continuity
//	modImplementation "maven.modrinth:1IjD5062:${project.continuity_version}"
//	//Bobby
//	modImplementation "maven.modrinth:M08ruV16:2cuVyTav"


	//Custom Shields
	modImplementation "maven.modrinth:shieldlib:${project.fabric_shield_lib_version}"
	modImplementation "maven.modrinth:modmenu:${project.mod_menu_version}"
	modImplementation "maven.modrinth:midnightlib:${project.midnightlib_version}"
	modImplementation "com.github.Chocohead:Fabric-ASM:v${project.fabricasm_version}"

	modImplementation "net.fabricmc.fabric-api:fabric-api-deprecated:${project.fabric_version}"

    //CustomPortalAPI
//	modImplementation 'net.kyrptonaught:customportalapi:0.0.1-beta64-1.20'
//	include 'net.kyrptonaught:customportalapi:0.0.1-beta64-1.20'

//	//XRay
//	modImplementation "curse.maven:advanced-xray-fabric-edition-444663:4595168"
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	repositories {
		//
	}
}