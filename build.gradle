plugins {
    id "fabric-loom" version "${loom_version}"
    id "maven-publish"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()

    // Fabric / Loom / Yarn
    maven { url = "https://maven.fabricmc.net/" }

    // ModMenu, MidnightLib, FabricShieldLib, Terrablender, CurseForge, Modrinth
    maven { url = "https://maven.terraformersmc.com/releases/" }
    maven { url = "https://maven.ladysnake.org/releases" }
    maven { url = 'https://maven.minecraftforge.net/' }
    maven { url = 'https://maven.kyrptonaught.dev' }
    maven { url = "https://maven.shedaniel.me/" }
    maven { url = "https://repo.spongepowered.org/maven" }
    maven { url = 'https://api.modrinth.com/maven' }
    maven { url = 'https://cursemaven.com' }
    maven { url = 'https://jitpack.io' }
    maven {
        name = 'ParchmentMC'
        url = 'https://maven.parchmentmc.org'
    }
}

loom {
    splitEnvironmentSourceSets()

    mods {
        "mores" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
    // This is the key: datagen output goes somewhere stable (not build/), and we use it as a resources source dir.
    runs {
        datagen {
            inherit server
            name "Data Generation"
            runDir "build/datagen"

            // Fabric datagen flags:
            vmArg "-Dfabric-api.datagen"
            vmArg "-Dfabric-api.datagen.output-dir=${file("src/main/generated")}"
            vmArg "-Dfabric-api.datagen.modid=${project.archives_base_name}"  // or hardcode "mores" if you prefer
            vmArg "-Dfabric-api.datagen.strict-validation=true"

            // Helpful when debugging what is / isn't being generated:
            // vmArg "-Dfabric-api.datagen.verbose=true"
        }
        client {
            vmArg "-Dfabric-tag-conventions-v2.missingTagTranslationWarning=VERBOSE"
        }
        server {
            vmArg "-Dfabric-tag-conventions-v2.missingTagTranslationWarning=VERBOSE"
        }
    }
}

/* ============================
   GENERATED RESOURCES
   ============================ */
sourceSets {
    main {
        resources {
            srcDir "src/main/generated"

            // don't package any dev cache folders as resources
            exclude("**/.cache/**")
            exclude(".cache/**")

            // don't package resources that belong to other mods (prevents duplicates like reflect.json)
            exclude("data/fabricshieldlib/**")
        }
    }
}

/* ============================
   DEPENDENCIES
   ============================ */
dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // Fabric API (required)
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api-deprecated:${project.fabric_version}"

    /* ---- REQUIRED AT COMPILE TIME ---- */
    // Fabric Shield Lib
    include(modImplementation("maven.modrinth:shieldlib:${project.fabric_shield_lib_version}"))

    // MidnightLib (used by shieldlib & config systems)
    include(modImplementation("maven.modrinth:midnightlib:${project.midnightlib_version}"))

    // ASM helper (used at compile time)
    include(modImplementation("com.github.Chocohead:Fabric-ASM:v${project.fabricasm_version}"))

    // Mod Menu (used to view config in-game)
    include(modImplementation("com.terraformersmc:modmenu:${project.mod_menu_version}"))

    // Backported Spears (compile against it; optional dependency)
    modCompileOnly "maven.modrinth:backported-spears:${project.backported_spears_version}"
//    include(modImplementation("maven.modrinth:backported-spears:${project.backported_spears_version}"))

    // REI (compile against it; optional dependency)
    modCompileOnly "maven.modrinth:architectury-api:${project.architectury_version}"
    modCompileOnly "maven.modrinth:cloth-config:${project.cloth_config_version}"
    modCompileOnly "me.shedaniel.cloth:basic-math:0.6.1"
    modCompileOnly "maven.modrinth:rei:${project.rei_version}"

    // Fuzs Easy Magic (compile against it; optional dependency)
    modCompileOnly "maven.modrinth:forge-config-api-port:${project.forge_config_api_port_version}"
    modCompileOnly "maven.modrinth:puzzles-lib:${project.puzzles_lib_version}"
    modCompileOnly "maven.modrinth:easy-magic:${project.easy_magic_version}"

    /* ---- RUNTIME / DEV ONLY MODS ---- */
    modRuntimeOnly "maven.modrinth:sodium:${project.sodium_version}"
    modRuntimeOnly "maven.modrinth:lithium:${project.lithium_version}"
    modRuntimeOnly "maven.modrinth:iris:${project.iris_version}"
    modRuntimeOnly "maven.modrinth:indium:${project.indium_version}"
    modRuntimeOnly "maven.modrinth:nvidium:${project.nvidium_version}"

    // Universal Ores (not needed at compile-time)
    modRuntimeOnly "maven.modrinth:universal_ores:${project.universal_ores_version}"

    // Serene Seasons (not needed at compile-time)
    modRuntimeOnly "maven.modrinth:serene-seasons:${project.serene_seasons_version}"

    // Jade
    modRuntimeOnly "maven.modrinth:jade:${project.jade_version}"

    //Continuity
    modRuntimeOnly "maven.modrinth:continuity:${project.continuity_version}"
//    modRuntimeOnly "maven.modrinth:platform:${project.platform_version}"
//    modRuntimeOnly "maven.modrinth:vanillabackport:${project.vanilla_backport_version}"
    // Xray
     modRuntimeOnly "curse.maven:advanced-xray-fabric-edition-444663:5424324"
    // modRuntimeOnly "maven.modrinth:entityculling:${project.entity_culling_version}"
}



tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

tasks.register("cleanGenerated") {
    group = "build"
    description = "Deletes src/main/generated"
    doLast {
        delete file("src/main/generated")
    }
}

processResources {
    // Keeps expansion correct for fabric.mod.json etc
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21

    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}

/* ============================
   MAVEN PUBLISH
   ============================ */
publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }

    repositories {
    }
}
