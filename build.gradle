plugins {
    id 'fabric-loom' version '1.8.9'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven { url = 'https://maven.minecraftforge.net/' }
    maven { url = 'https://api.modrinth.com/maven' }
    maven { url = 'https://maven.kyrptonaught.dev' }
    maven { url = 'https://jitpack.io' }
    maven { url = 'https://maven.terraformersmc.com/releases/' }
    maven { url = 'https://cursemaven.com' }
    maven {
        name = 'ParchmentMC'
        url = 'https://maven.parchmentmc.org'
    }
}

loom {
    splitEnvironmentSourceSets()

    mods {
        "mores" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

fabricApi {
    configureDataGeneration()
}

/* ============================
   GENERATED RESOURCES
   ============================ */
sourceSets {
    main {
        resources {
            srcDir "src/main/generated"

            // don't package any dev cache folders as resources
            exclude("**/.cache/**")
            exclude(".cache/**")

            // don't package resources that belong to other mods (prevents duplicates like reflect.json)
            exclude("data/fabricshieldlib/**")
        }
    }
}

tasks.named("runDatagen") {
    outputs.dir file("src/main/generated")
}

/* ============================
   DEPENDENCIES
   ============================ */
dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // Fabric API (required)
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api-deprecated:${project.fabric_version}"

    /* ---- REQUIRED AT COMPILE TIME ---- */

    // Fabric Shield Lib (you USE this in code)
    modImplementation "maven.modrinth:shieldlib:${project.fabric_shield_lib_version}"

    // MidnightLib (used by shieldlib & config systems)
    modImplementation "maven.modrinth:midnightlib:${project.midnightlib_version}"

    // ASM helper (used at compile time)
    modImplementation "com.github.Chocohead:Fabric-ASM:v${project.fabricasm_version}"

    /* ---- RUNTIME / DEV ONLY MODS ---- */

    modRuntimeOnly "maven.modrinth:sodium:${project.sodium_version}"
    modRuntimeOnly "maven.modrinth:lithium:${project.lithium_version}"
    modRuntimeOnly "maven.modrinth:iris:${project.iris_version}"
    modRuntimeOnly "maven.modrinth:indium:${project.indium_version}"
    modRuntimeOnly "maven.modrinth:nvidium:${project.nvidium_version}"
    modRuntimeOnly "maven.modrinth:modmenu:${project.mod_menu_version}"

    // Universal Ores (not needed at compile-time)
    modRuntimeOnly "maven.modrinth:universal_ores:${project.universal_ores_version}"

    // Optional examples (kept commented)
    // modRuntimeOnly "maven.modrinth:entityculling:${project.entity_culling_version}"
    // modRuntimeOnly "maven.modrinth:advanced-xray-fabric-edition-444663:4595168"
}

tasks.named("processResources") {
    // Fix Gradle 8+ failing on duplicate resources
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}

/* ============================
   MAVEN PUBLISH
   ============================ */
publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }

    repositories {
        //
    }
}
